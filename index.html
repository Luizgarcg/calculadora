<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculadora</title>
  </head>
  <body>
    <header><h1>Calculadora</h1></header>
    <main class="calculadora">
      <div id="resultado">0</div>

      <button class="botao-limpar">C</button>
      <button class="botao-apagar">⌫</button>
      <button class="botao-numero" data-valor=".">.</button>
      <button class="botao-operador" data-operador="/">÷</button>

      <button class="botao-numero" data-valor="7">7</button>
      <button class="botao-numero" data-valor="8">8</button>
      <button class="botao-numero" data-valor="9">9</button>
      <button class="botao-operador" data-operador="*">×</button>

      <button class="botao-numero" data-valor="4">4</button>
      <button class="botao-numero" data-valor="5">5</button>
      <button class="botao-numero" data-valor="6">6</button>
      <button class="botao-operador" data-operador="-">−</button>

      <button class="botao-numero" data-valor="1">1</button>
      <button class="botao-numero" data-valor="2">2</button>
      <button class="botao-numero" data-valor="3">3</button>
      <button class="botao-operador" data-operador="+">+</button>

      <button class="botao-numero botao-duplo" data-valor="0">0</button>
      <button class="botao-igual botao-duplo">=</button>

      <script src="script.js"></script>
    </main>
  </body>
</html>
</html>
